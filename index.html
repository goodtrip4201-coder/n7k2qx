<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>RADAR</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;background:#000}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.8/dist/mqtt.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ===== radar core (shared by the local ESP32 page and the remote MQTT page) =====
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0,CX=0,CY=0,R=0,dpr=1;
const MAXR=400, AMIN=15, AMAX=165;
let csi=0, ready=false, lastMsg=0, linkOk=false;
// sweep model: extrapolated locally every frame, gently corrected by data
let sw={lastA:90,lastT:0,dir:1,speed:37.5,disp:90,have:false};
let roomT={}, roomD={};            // angle -> target r / displayed r
let tracks={};                     // id -> {ta,tr,a,r,lit,trail:[],dead}
let ripple=null, onRefresh=null;
const TRAIL_MS=3000;

function layout(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=(W*dpr)|0; cv.height=(H*dpr)|0;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
  const pad=Math.max(14,Math.min(W,H)*0.03);
  CX=W/2; CY=H-pad; R=Math.min(W*0.5-pad,CY-pad);
  grid=null;
}
let grid=null;   // pre-rendered static grid (cheap frames = no stutter on phones)
window.addEventListener('resize',layout,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(layout,250));
function polar(a,r){const t=a*Math.PI/180;return[CX+r*Math.cos(t),CY-r*Math.sin(t)];}

function buildGrid(){
  grid=document.createElement('canvas');
  grid.width=cv.width; grid.height=cv.height;
  const g=grid.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const bg=g.createRadialGradient(CX,CY,R*0.05,CX,CY,R*1.1);
  bg.addColorStop(0,'#00160a'); bg.addColorStop(1,'#000300');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(0,200,80,0.30)'; g.lineWidth=1;
  g.beginPath(); g.arc(CX,CY,R,Math.PI,0); g.stroke();
  g.font=Math.max(9,Math.round(R*0.028))+'px ui-monospace,Menlo,Consolas,monospace';
  g.textAlign='right'; g.textBaseline='middle';
  for(let i=1;i<=4;i++){
    const rr=R*i/4;
    g.strokeStyle='rgba(0,200,80,0.17)';
    g.beginPath(); g.arc(CX,CY,rr,Math.PI,0); g.stroke();
    g.fillStyle='rgba(80,200,110,0.35)'; g.fillText(Math.round(MAXR*i/4),CX+rr-6,CY-10);
  }
  for(let a=0;a<=180;a+=15){
    const th=a%30===0; g.strokeStyle=th?'rgba(0,200,80,0.26)':'rgba(0,200,80,0.09)';
    g.lineWidth=th?1.1:0.6; const[x,y]=polar(a,R);
    g.beginPath(); g.moveTo(CX,CY); g.lineTo(x,y); g.stroke();
  }
  g.strokeStyle='rgba(0,200,80,0.35)'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(CX-R,CY); g.lineTo(CX+R,CY); g.stroke();
}

function applyState(j,now){
  lastMsg=now;
  if(typeof j.csi==='number') csi=j.csi;
  if(typeof j.ready==='boolean') ready=j.ready;
  if(typeof j.a==='number'){
    const d=(j.d===1||j.d===-1)?j.d:sw.dir;
    if(!sw.have){ sw.disp=j.a; sw.have=true; }
    else if(d===sw.dir && now>sw.lastT){
      const dt=(now-sw.lastT)/1000, mv=Math.abs(j.a-sw.lastA);
      if(dt>0.04 && dt<1.5 && j.a>AMIN+12 && j.a<AMAX-12){
        const inst=mv/dt; if(inst>5&&inst<150) sw.speed+= (inst-sw.speed)*0.08;
      }
    }
    sw.dir=d; sw.lastA=j.a; sw.lastT=now;
  }
  if(Array.isArray(j.m)){
    const nt={}; for(const p of j.m) nt[p[0]]=p[1];
    roomT=nt; for(const k in nt) if(roomD[k]===undefined) roomD[k]=nt[k];
    for(const k in roomD) if(nt[k]===undefined) delete roomD[k];
  }
  if(Array.isArray(j.t)){
    const seen={};
    for(const row of j.t){
      const id=row[0],a=row[1],r=row[2]; seen[id]=1;
      let tr=tracks[id];
      if(!tr) tr=tracks[id]={ta:a,tr:r,a:a,r:r,lit:now,trail:[],dead:0,lastPush:0};
      tr.ta=a; tr.tr=r; tr.dead=0;
    }
    for(const id in tracks) if(!seen[id] && !tracks[id].dead) tracks[id].dead=now;
  }
}

function stepSweep(now,dt){
  let p=sw.lastA+sw.dir*sw.speed*(now-sw.lastT)/1000;
  if(p>AMAX) p=AMAX; if(p<AMIN) p=AMIN;
  if(now-lastMsg>2500) return;                // feed lost: hold still, don't spin fake
  sw.disp+=(p-sw.disp)*Math.min(1,dt*9);
}

function drawMap(dt){
  const keys=Object.keys(roomD).map(Number).sort((a,b)=>a-b);
  if(!keys.length) return;
  const k=Math.min(1,dt*1.5);
  for(const a of keys){ if(roomT[a]!==undefined) roomD[a]+=(roomT[a]-roomD[a])*k; }
  const al=ready?0.36:0.16;
  for(const pass of [[6,'rgba(0,255,90,'+(al*0.22)+')'],[2,'rgba(70,255,130,'+al+')']]){
    cx.strokeStyle=pass[1]; cx.lineWidth=pass[0]; cx.lineJoin='round'; cx.lineCap='round';
    cx.beginPath(); let on=false,pa=0,pr=0;
    for(const a of keys){
      const r=roomD[a]; if(!(r>0&&r<=MAXR)) {on=false; continue;}
      const[x,y]=polar(a,R*r/MAXR);
      if(!on||a-pa>8||Math.abs(r-pr)>Math.max(40,r*0.25)){cx.moveTo(x,y);on=true;}
      else cx.lineTo(x,y);
      pa=a; pr=r;
    }
    cx.stroke();
  }
}

function drawSweep(){
  const a0=sw.disp, d=sw.dir, N=12, tail=24;
  cx.save();
  for(let i=0;i<N;i++){                       // phosphor wedge trailing the beam
    const s=a0-d*tail*i/N, e=a0-d*tail*(i+1)/N;
    const t0=-s*Math.PI/180, t1=-e*Math.PI/180;
    cx.fillStyle='rgba(90,255,130,'+((0.16+0.12*csi)*(1-i/N))+')';
    cx.beginPath(); cx.moveTo(CX,CY); cx.arc(CX,CY,R,Math.min(t0,t1),Math.max(t0,t1)); cx.closePath(); cx.fill();
  }
  const[x,y]=polar(a0,R);
  cx.strokeStyle='rgba(190,255,200,'+(0.8+0.2*csi)+')'; cx.lineWidth=1.8;
  cx.beginPath(); cx.moveTo(CX,CY); cx.lineTo(x,y); cx.stroke();
  cx.restore();
}

function drawTracks(now,dt){
  const k=Math.min(1,dt*3.5);
  for(const id in tracks){
    const tr=tracks[id];
    if(tr.dead && now-tr.dead>TRAIL_MS){ delete tracks[id]; continue; }
    tr.a+=(tr.ta-tr.a)*k; tr.r+=(tr.tr-tr.r)*k;
    if(Math.abs(sw.disp-tr.a)<3) tr.lit=now;               // beam repaints the blip
    if(!tr.dead && now-tr.lastPush>180){ tr.trail.push({a:tr.a,r:tr.r,t:now}); tr.lastPush=now; }
    tr.trail=tr.trail.filter(p=>now-p.t<TRAIL_MS);
    for(let i=0;i<tr.trail.length;i++){
      const p=tr.trail[i], age=(now-p.t)/TRAIL_MS;
      const[x,y]=polar(p.a,R*p.r/MAXR);
      cx.fillStyle='rgba(140,255,170,'+(0.45*(1-age))+')';
      cx.beginPath(); cx.arc(x,y,1.5+2*(1-age),0,7); cx.fill();
    }
    if(tr.dead) continue;
    const glow=0.35+0.65*Math.exp(-(now-tr.lit)/1600);
    const[x,y]=polar(tr.a,R*Math.min(tr.r,MAXR)/MAXR);
    const rad=14+8*csi;
    const b=cx.createRadialGradient(x,y,0,x,y,rad);
    b.addColorStop(0,'rgba(230,255,230,'+glow+')');
    b.addColorStop(0.3,'rgba(80,255,120,'+(0.8*glow)+')');
    b.addColorStop(1,'rgba(80,255,120,0)');
    cx.fillStyle=b; cx.beginPath(); cx.arc(x,y,rad,0,7); cx.fill();
  }
}

let lastFrame=0;
function draw(){
  const now=performance.now(), dt=Math.min(0.1,(now-(lastFrame||now))/1000); lastFrame=now;
  if(!grid) buildGrid();
  cx.drawImage(grid,0,0,W,H);
  if(csi>0.02){ cx.fillStyle='rgba(0,255,80,'+(0.12*csi)+')'; cx.beginPath(); cx.arc(CX,CY,R,Math.PI,0); cx.fill(); }
  stepSweep(now,dt);
  drawMap(dt);
  drawSweep();
  drawTracks(now,dt);
  cx.fillStyle='rgba(140,255,160,0.8)'; cx.beginPath(); cx.arc(CX,CY,3,0,7); cx.fill();
  const ok=now-lastMsg<2500;
  cx.fillStyle=ok?'rgba(80,255,120,0.6)':'rgba(190,40,40,0.6)';
  cx.beginPath(); cx.arc(W-12,12,3.5,0,7); cx.fill();
  if(ripple){
    const age=(now-ripple.t)/550;
    if(age>=1) ripple=null;
    else{
      cx.strokeStyle='rgba(140,255,170,'+(0.65*(1-age))+')';
      cx.lineWidth=1.5;
      cx.beginPath(); cx.arc(ripple.x,ripple.y,8+age*48,0,7); cx.stroke();
    }
  }
  requestAnimationFrame(draw);
}
layout();

function triggerRefresh(x,y){
  const now=performance.now();
  tracks={};
  sw.have=false;
  ripple={x:(typeof x==='number'?x:CX), y:(typeof y==='number'?y:CY), t:now};
  if(typeof onRefresh==='function') onRefresh();
}
cv.addEventListener('dblclick',e=>triggerRefresh(e.clientX,e.clientY));
let lastTapT=0, lastTapX=0, lastTapY=0;
cv.addEventListener('pointerup',e=>{
  if(e.pointerType==='mouse') return;
  const now=performance.now(), dx=e.clientX-lastTapX, dy=e.clientY-lastTapY;
  if(now-lastTapT<340 && (dx*dx+dy*dy)<2000){
    lastTapT=0; triggerRefresh(e.clientX,e.clientY);
  }else{
    lastTapT=now; lastTapX=e.clientX; lastTapY=e.clientY;
  }
},{passive:true});
// ---- remote transport: MQTT over secure WebSockets ----
const MQTT_URL='wss://broker.emqx.io:8084/mqtt';
const TOPIC_LIVE='wfr/sJ6igkE0yxCfa0mvfo03xCNDSA129Hcc/l';
const TOPIC_MAP='wfr/sJ6igkE0yxCfa0mvfo03xCNDSA129Hcc/m';
let mq=null;
function connectMqtt(){
  if(typeof mqtt==='undefined'){ setTimeout(connectMqtt,500); return; }
  if(mq){ try{mq.end(true);}catch(e){} mq=null; }
  const c=mqtt.connect(MQTT_URL,{clientId:'wfrw-'+Math.random().toString(16).slice(2,10),
    clean:true,reconnectPeriod:2500,connectTimeout:12000,keepalive:30});
  mq=c;
  c.on('connect',()=>{ if(mq===c) c.subscribe([TOPIC_LIVE,TOPIC_MAP],{qos:0}); });
  c.on('message',(_t,p)=>{ if(mq!==c) return; try{ applyState(JSON.parse(p.toString()),performance.now()); }catch(e){} });
}
onRefresh=()=>{ lastMsg=0; connectMqtt(); };
connectMqtt();
requestAnimationFrame(draw);
</script>
</body></html>
